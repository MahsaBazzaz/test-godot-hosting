<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Survey</title>
</head>
<body>

  <div id="app">Loading...</div>

  <script>
    const routes = {
      smb: 'mario.html',
      soko: 'sokoban.html'
    };

    async function loadRoute() {
      const hash = location.hash.slice(1); 
      const [page, section] = hash.split('/');
      console.log(page)
      console.log(section)
      const file = routes[page];
      if (!file) {
        document.getElementById('app').innerHTML = '<h2>404 Not Found</h2>';
        return;
      }

      try {
        const res = await fetch(file);
        const html = await res.text();
        document.getElementById('app').innerHTML = html;

        // Wait a bit and then scroll to the section
        if (section) {
          setTimeout(() => {
            const el = document.getElementById(section);
            if (el) el.scrollIntoView({ behavior: 'smooth' });
          }, 100);
        }
      } catch (err) {
        document.getElementById('app').innerHTML = '<h2>Error loading content.</h2>';
      }
    }

    window.addEventListener('hashchange', loadRoute);
    window.addEventListener('load', loadRoute);
  </script>
</body>
</html>
